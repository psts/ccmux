<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ccmux</title>
  <meta name="theme-color" content="#1c1e22">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ccmux">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header>
        <span class="logo">ccmux</span>
        <div class="hdr-actions">
          <button id="open-settings" title="Settings">&#9881;</button>
          <button id="new-ws" title="New workspace">+</button>
        </div>
      </header>
      <ul id="ws-list"></ul>
    </aside>
    <div id="drawer-backdrop"></div>
    <main id="main">
      <div id="bar">
        <button id="menu-toggle" title="Sessions" aria-label="Sessions">&#9776;</button>
        <button id="takeover" title="Resize this session to fit your screen">&#8596; Take over</button>
        <div id="tabs"></div>
        <button id="pane-add" title="New pane…">+</button>
        <div id="presence"></div>
      </div>
      <div id="harness-bar" class="harness-bar hidden"></div>
      <p id="daemon-warning" class="daemon-warning hidden"></p>
      <div id="terminal"></div>
      <div id="empty" class="empty">Select a workspace</div>
    </main>
  </div>

  <div id="project-modal" class="modal hidden">
    <div class="sheet">
      <header>
        <span>New workspace</span>
        <button id="project-close" title="Close">&times;</button>
      </header>
      <select id="project-host" class="setting-input project-cmd hidden"
              title="Create on which host"></select>
      <p id="project-path" class="crumb"></p>
      <p id="project-status" class="status hidden"></p>
      <ul id="project-list" class="project-list"></ul>
      <!-- New folder in the currently listed location: plain (a group of
           projects) or git-inited (a repo-to-be). -->
      <div class="new-folder">
        <input id="project-folder" class="setting-input" type="text" spellcheck="false"
               autocomplete="off" placeholder="new folder here">
        <label><input id="project-folder-git" type="checkbox"> git init</label>
        <button id="project-folder-mk">Create</button>
      </div>
      <input id="project-cmd" class="setting-input project-cmd" type="text" spellcheck="false"
             autocomplete="off" placeholder="startup command — empty = shell (pick a harness in the workspace)">
      <input id="project-group" class="setting-input project-cmd" type="text" spellcheck="false"
             autocomplete="off" list="project-group-options"
             placeholder="window group — empty = auto">
      <datalist id="project-group-options"></datalist>
    </div>
  </div>

  <!-- Workspace context menu (right-click / ⋯) — mirrors the Mac hosted menu. -->
  <div id="ctx-menu" class="ctx-menu hidden"></div>

  <!-- Hostnames editor — dev hostname↔port mappings + the ▶ dev command. -->
  <div id="hostnames-modal" class="modal hidden">
    <div class="sheet">
      <header>
        <span id="hostnames-title">Hostnames</span>
        <button id="hostnames-close" title="Close">&times;</button>
      </header>
      <p class="crumb">Dev hostnames served over the tailnet, mapped to local ports.</p>
      <ul id="hostnames-rows" class="hostname-rows"></ul>
      <button id="hostnames-add" class="hn-add">+ add mapping</button>
      <input id="hostnames-cmd" class="setting-input" type="text" spellcheck="false"
             autocomplete="off" placeholder="dev command — what ▶ runs">
      <!-- Shown when a stored command's repo-detected counterpart changed. -->
      <p id="hostnames-cmd-hint" class="crumb hidden">
        <span id="hostnames-cmd-detected"></span>
        <button id="hostnames-cmd-use" class="hn-add" type="button">use detected</button>
      </p>
      <p id="hostnames-error" class="status hidden"></p>
      <div class="sheet-actions"><button id="hostnames-save">Save</button></div>
    </div>
  </div>

  <div id="peers-modal" class="modal hidden">
    <div class="sheet peers-sheet">
      <header>
        <span id="peers-title">Messages</span>
        <button id="peers-close" title="Close">&times;</button>
      </header>
      <ul id="peers-list" class="peers-list"></ul>
      <p id="peers-status" class="status hidden"></p>
      <div id="peers-msgs" class="peers-msgs"></div>
    </div>
  </div>

  <div id="settings-modal" class="modal hidden">
    <div class="sheet settings-sheet">
      <header>
        <span>Settings</span>
        <button id="settings-close" title="Close">&times;</button>
      </header>
      <nav id="settings-tabs" class="settings-tabs">
        <button class="settings-tab active" data-page="accounts" type="button">Accounts</button>
        <button class="settings-tab" data-page="harnesses" type="button">Harnesses</button>
        <button class="settings-tab" data-page="notifications" type="button">Notifications</button>
      </nav>
      <div class="settings-body">
        <section class="settings-page" data-page="accounts">
          <label class="setting-label" for="llm-route">Default account (all panes)</label>
          <select id="llm-route" class="setting-input"></select>
          <p id="llm-route-state" class="hint setting-hint"></p>
          <label class="setting-label">LLM accounts</label>
          <div id="llm-accounts" class="rules-list"></div>
          <button id="llm-account-add" class="rule-add" type="button">+ Add account</button>
          <p id="llm-state" class="hint setting-hint"></p>
        </section>
        <section class="settings-page hidden" data-page="harnesses">
          <div id="harness-list" class="rules-list"></div>
          <button id="harness-add" class="rule-add" type="button">+ Add harness</button>
          <p id="harness-state" class="hint setting-hint"></p>
          <label class="setting-label">Per-folder default harness (longest match wins)</label>
          <div id="harness-rules" class="rules-list"></div>
          <button id="harness-rule-add" class="rule-add" type="button">+ Add folder rule</button>
          <p id="harness-rules-state" class="hint setting-hint"></p>
        </section>
        <section class="settings-page hidden" data-page="notifications">
          <p id="notif-status" class="status"></p>
          <p id="ios-hint" class="hint hidden"></p>
          <div class="sheet-actions">
            <button id="notif-enable" class="primary hidden">Enable notifications</button>
            <button id="notif-disable" class="hidden">Turn off</button>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/app.js"></script>
  <script src="/peers.js"></script>
  <script src="/push.js"></script>
</body>
</html>
