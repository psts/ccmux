<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ccmux</title>
  <meta name="theme-color" content="#1c1e22">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ccmux">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header>
        <span class="logo">ccmux</span>
        <div class="hdr-actions">
          <button id="open-settings" title="Settings">&#9881;</button>
          <button id="new-ws" title="New workspace">+</button>
        </div>
      </header>
      <ul id="ws-list"></ul>
    </aside>
    <div id="drawer-backdrop"></div>
    <main id="main">
      <div id="bar">
        <button id="menu-toggle" title="Sessions" aria-label="Sessions">&#9776;</button>
        <button id="takeover" title="Resize this session to fit your screen">&#8596; Take over</button>
        <div id="tabs"></div>
        <div id="presence"></div>
      </div>
      <div id="terminal"></div>
      <div id="empty" class="empty">Select a workspace</div>
    </main>
  </div>

  <div id="project-modal" class="modal hidden">
    <div class="sheet">
      <header>
        <span>New workspace</span>
        <button id="project-close" title="Close">&times;</button>
      </header>
      <p id="project-path" class="crumb"></p>
      <p id="project-status" class="status hidden"></p>
      <ul id="project-list" class="project-list"></ul>
    </div>
  </div>

  <div id="peers-modal" class="modal hidden">
    <div class="sheet peers-sheet">
      <header>
        <span id="peers-title">Messages</span>
        <button id="peers-close" title="Close">&times;</button>
      </header>
      <ul id="peers-list" class="peers-list"></ul>
      <p id="peers-status" class="status hidden"></p>
      <div id="peers-msgs" class="peers-msgs"></div>
    </div>
  </div>

  <div id="settings-modal" class="modal hidden">
    <div class="sheet">
      <header>
        <span>Settings</span>
        <button id="settings-close" title="Close">&times;</button>
      </header>
      <label class="setting-label" for="startup-cmd">New workspace startup command</label>
      <input id="startup-cmd" class="setting-input" type="text" spellcheck="false"
             placeholder="claude …" autocomplete="off">
      <p id="startup-cmd-state" class="hint setting-hint"></p>
      <p class="setting-label">Notifications</p>
      <p id="notif-status" class="status"></p>
      <p id="ios-hint" class="hint hidden"></p>
      <div class="sheet-actions">
        <button id="notif-enable" class="primary hidden">Enable notifications</button>
        <button id="notif-disable" class="hidden">Turn off</button>
      </div>
    </div>
  </div>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/app.js"></script>
  <script src="/peers.js"></script>
  <script src="/push.js"></script>
</body>
</html>
