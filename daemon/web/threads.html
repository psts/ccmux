<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ccmux threads</title>
  <meta name="theme-color" content="#EDEDE8">
  <link rel="icon" href="/icons/icon-192.png">
  <script src="/threadtheme.js"></script>
  <link rel="stylesheet" href="/threads.css">
  <link rel="stylesheet" href="/settings.css">
  <link rel="stylesheet" href="/tasks.css">
  <link rel="stylesheet" href="/threadtodo.css">
</head>
<body>
  <!-- The thread page: runner sessions (Claude on the Agent SDK) worked with
       as conversations, no terminal. Its own page beside the lens
       (index.html), which is unchanged; threads.js is its controller. -->
  <div id="page">
    <nav id="side" aria-label="Threads">
      <div class="side-head">
        <a class="logo" href="/" title="Back to the terminal lens">ccmux</a>
        <div class="side-actions">
          <button id="theme" class="side-add side-icon" type="button" title="Theme: System" aria-label="Theme: System">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.3 1.1 2.2h5c0-.9.5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
          </button>
          <button id="open-settings" class="side-add side-icon" type="button" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </button>
          <button id="add-repo" class="side-add" type="button" title="Add a repo" aria-label="Add a repo">+</button>
        </div>
      </div>
      <div id="tree"></div>
      <div class="side-foot">
        <span id="side-version"></span>
      </div>
    </nav>

    <main id="main">
      <header id="head">
        <button id="side-toggle" type="button" aria-label="Threads">&#9776;</button>
        <div class="head-title">
          <h1 id="title">Threads</h1>
          <div id="meta" class="meta"></div>
        </div>
        <span id="gauge" class="gauge hidden"></span>
        <span id="state" class="badge hidden"></span>
        <label id="model-box" class="model hidden">Model
          <select id="model"></select>
        </label>
        <label id="advisor-box" class="model hidden" title="The stronger model Claude may ask for advice. Applies when the session restarts.">Advisor
          <select id="advisor"></select>
        </label>
        <label id="mode-box" class="model hidden" title="How freely Claude may act, like Shift+Tab in Claude Code. Until the session restarts.">Mode
          <select id="mode"></select>
        </label>
        <button id="past" class="plain hidden" type="button" title="This agent's earlier conversations, read only">Earlier</button>
        <button id="new-thread" class="plain hidden" type="button" title="A new thread in this repo: its own session, and its own copy of the repo once it changes something">New thread</button>
        <button id="restart-later" class="apply hidden" type="button"></button>
        <button id="stop" class="plain hidden" type="button" title="Stop the running turn">Stop</button>
        <details id="more" class="more hidden">
          <summary title="More">&#8943;</summary>
          <div class="more-menu">
            <button id="merge-thread" type="button" title="Land every member's branch through its repo's checks">Merge thread</button>
            <button id="end-thread" type="button" title="Stand every helper down and close the thread">Close thread</button>
            <button id="start-over" type="button" title="A new conversation; this one stays above a divider">Start over</button>
            <button id="rename" type="button">Rename</button>
            <button id="sleep" type="button">Put to sleep</button>
            <button id="end" type="button">End this session</button>
          </div>
        </details>
      </header>

      <div id="model-bar" class="bar blue hidden" role="status">
        <span id="model-bar-text" class="grow"></span>
        <button id="restart-now" class="primary" type="button">Restart now</button>
        <button id="later" class="plain" type="button">Later</button>
      </div>
      <div id="loadout-bar" class="bar blue hidden" role="status">
        <span class="grow"><strong>Skills changed, restart to use them.</strong> This session keeps its old list until then.</span>
        <button id="loadout-restart" class="primary" type="button">Restart now</button>
      </div>
      <div id="merge-bar" class="bar blue hidden" role="status">
        <span id="merge-text" class="grow"></span>
        <button id="stop-merge" class="plain hidden" type="button" title="End the merge's checks. What already landed stays landed.">Stop merge</button>
      </div>
      <div id="restarted-bar" class="bar green hidden" role="status"></div>
      <div id="notice-bar" class="bar amber hidden" role="status"></div>
      <div id="past-bar" class="bar blue hidden" role="status"><span id="past-text"></span> <button id="past-back" class="link" type="button">Back to now</button></div>
      <div id="error-bar" class="bar red hidden" role="alert"></div>
      <div id="limit-bar" class="bar amber hidden" role="status"></div>

      <div id="goal" class="goal hidden">
        <span class="goal-label">Goal</span>
        <span id="goal-text"></span>
      </div>

      <div id="stream" class="stream">
        <div id="blocks" class="blocks"></div>
        <div id="cards" class="cards"></div>
        <div id="empty" class="empty">Pick a repo on the left to talk to its lead, or start a thread.</div>
      </div>

      <!-- A group's task queue (taskview.js, threadtasks.js), in place of
           the conversation while it is open. -->
      <div id="tasks" class="tasks hidden"></div>

      <!-- A repo's to-do list (threadtodoview.js), in place of the
           conversation while it is open: what its sessions noticed and
           left. Not a session's own steps, which are the Steps tab. -->
      <div id="repo-todo" class="rt hidden"></div>

      <!-- The session's background tasks (threadlive.js), each with Stop. -->
      <div id="bgtasks-bar" class="bgtasks hidden" role="status"></div>

      <form id="composer" class="composer ac-compose hidden">
        <div id="attached" class="attached"></div>
        <textarea id="input" rows="2" autocomplete="off" spellcheck="true" aria-label="Message"></textarea>
        <div id="commands" class="commands hidden"></div>
        <div id="mentions" class="commands hidden" role="listbox" aria-label="Files to mention"></div>
        <div class="composer-row">
          <button id="attach" class="icon" type="button" aria-label="Attach image" title="Attach an image (or paste one)">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
          </button>
          <input id="file" type="file" accept="image/*" multiple class="hidden">
          <button id="slash" class="mono" type="button">/ commands</button>
          <button id="suggest" class="suggest hidden" type="button" title="Use Claude's suggested next message (Tab)">Use suggestion</button>
          <span id="hint" class="hint grow">Lands as the next turn if Claude is busy</span>
          <button id="send" class="primary" type="submit">Send</button>
        </div>
      </form>
    </main>

    <aside id="detail" aria-label="Thread details">
      <div class="tabs" role="tablist">
        <button class="tab on" role="tab" data-tab="changes" type="button">Changes</button>
        <button class="tab" role="tab" data-tab="team" type="button">Helpers</button>
        <button class="tab" role="tab" data-tab="steps" type="button" title="This session's own step list">Steps</button>
      </div>
      <div id="tab-changes" class="tab-body"></div>
      <div id="tab-team" class="tab-body hidden"></div>
      <div id="tab-steps" class="tab-body hidden"></div>
    </aside>
  </div>

  <!-- Skills and plugins (threadcapsctl.js): a repo's or group's panel, and
       the sidebar's right-click menu. The whole list is a tab of the
       Settings window. -->
  <div id="caps-overlay" class="overlay hidden">
    <div id="caps-sheet" class="sheet narrow" role="dialog" aria-modal="true"></div>
  </div>
  <div id="caps-menu" class="menu-layer hidden"></div>

  <!-- A message on a cold prompt cache (threadclean.js): start clean, or
       go on in the same conversation. -->
  <dialog id="clean-ask" class="clean-ask" aria-labelledby="clean-head">
    <form method="dialog">
      <h2 id="clean-head">The prompt cache is cold</h2>
      <p id="clean-text"></p>
      <div class="clean-row">
        <button class="plain" value="" type="submit">Cancel</button>
        <button class="plain" value="continue" type="submit">Continue</button>
        <button class="primary" value="clean" type="submit" autofocus>Start clean</button>
      </div>
    </form>
  </dialog>

  <!-- The sidebar's "+" (threadnewrepo.js): add a repo, in a group. -->
  <div id="repo-overlay" class="overlay hidden">
    <div id="repo-sheet" class="sheet narrow" role="dialog" aria-modal="true" aria-label="Add a repo"></div>
  </div>

  <!-- A repo's "Hostnames…" (threadhostnamesctl.js): its dev host names. -->
  <div id="hosts-overlay" class="overlay hidden">
    <div id="hosts-sheet" class="sheet narrow" role="dialog" aria-modal="true" aria-label="Hostnames"></div>
  </div>

  <!-- The Settings window (settingsmodal.js) makes its own markup, and each
       tab is its own file; the lens loads the same block. This page's own
       tab, Skills and plugins, joins it from threadcapsctl.js. -->
  <script src="/dom.js"></script>
  <script src="/identity.js"></script>
  <script src="/settingsmodal.js"></script>
  <script src="/settingsllm.js"></script>
  <script src="/settingsllmedit.js"></script>
  <script src="/settingsaccounts.js"></script>
  <script src="/settingsharness.js"></script>
  <script src="/settingsharnesses.js"></script>
  <script src="/settingsharnessrules.js"></script>
  <script src="/settingsagents.js"></script>
  <script src="/tasksettings.js"></script>
  <script src="/settingssandbox.js"></script>
  <script src="/push.js"></script>
  <script src="/agentcaps.js"></script>
  <script src="/agentmodal.js"></script>
  <script src="/retry.js"></script>
  <script src="/route.js"></script>
  <script src="/agentchat.js"></script>
  <script src="/threadmodel.js"></script>
  <script src="/threadadvisor.js"></script>
  <script src="/threadgauge.js"></script>
  <script src="/threadteam.js"></script>
  <script src="/threadstream.js"></script>
  <script src="/threadwork.js"></script>
  <script src="/threadmd.js"></script>
  <script src="/threadimage.js"></script>
  <script src="/threadpending.js"></script>
  <script src="/threadcmds.js"></script>
  <script src="/tasklist.js"></script>
  <script src="/taskview.js"></script>
  <script src="/threadtasks.js"></script>
  <script src="/threadtodo.js"></script>
  <script src="/threadtodoview.js"></script>
  <script src="/threadsideprefs.js"></script>
  <script src="/threadview.js"></script>
  <script src="/threadcaps.js"></script>
  <script src="/threadcapsview.js"></script>
  <script src="/threadcapsctl.js"></script>
  <script src="/threadsidectl.js"></script>
  <script src="/threadpast.js"></script>
  <script src="/threadearlier.js"></script>
  <script src="/threadclean.js"></script>
  <script src="/threadgroups.js"></script>
  <script src="/threadgroupsctl.js"></script>
  <script src="/threadnewrepo.js"></script>
  <script src="/threadhostnames.js"></script>
  <script src="/threadedit.js"></script>
  <script src="/threadlive.js"></script>
  <script src="/threadmention.js"></script>
  <script src="/threadhostnamesctl.js"></script>
  <script src="/threads.js"></script>
  <script src="/build.js"></script>
  <script src="/update.js"></script>
</body>
</html>
