# Managed tmux config for the dedicated ccmux server (`tmux -L ccmux -f this`).
# ccmuxd is the ONLY client (control mode); lenses render %output themselves.
# Kept separate from user dotfiles so lens behavior is deterministic.

# --- terminal identity & capabilities ---
set -g default-terminal "tmux-256color"
# Declare what our lens emulators (SwiftTerm, xterm.js) actually support so tmux
# negotiates the right sequences for the inner app (Claude Code).
set -as terminal-features "*:RGB:clipboard:hyperlinks:usstyle:title"

# --- input fidelity (the S1 spike surface) ---
# Claude Code relies on modified keys (Shift+Enter etc.). tmux has no native
# kitty-keyboard passthrough, so we drive CSI-u extended keys instead.
set -g extended-keys always
set -s escape-time 10
set -g focus-events on
set -g mouse on

# --- clipboard ---
set -g set-clipboard on
# A tmux-level copy (mouse drag / clicks / copy keys) lands in tmux's OWN
# buffer on this host; set-clipboard's OSC 52 goes to the control-mode client
# (ccmuxd), never into pane output, so the lens's OS clipboard is deaf to it.
# These bindings keep the default copy behavior AND pipe the text to ccmuxd,
# which pushes it to the lenses attached to that pane's workspace — the lens
# writes its OS clipboard, so selecting IS copying on every device.
# __CCMUX_COPY__ is substituted at startup with a daemon-written helper script
# (auth token + loopback URL baked in; errors land in <runtimeDir>/clipboard.log).
# The click bindings replicate tmux 3.6b's defaults verbatim (captured via
# `tmux -f /dev/null list-keys`) with only the pipe command appended — the
# if-shell mouse guard must stay, or clicks stop reaching mouse-aware apps.
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "__CCMUX_COPY__ '#{pane_id}'"
bind -T copy-mode    C-w               send-keys -X copy-pipe-and-cancel "__CCMUX_COPY__ '#{pane_id}'"
bind -T copy-mode    M-w               send-keys -X copy-pipe-and-cancel "__CCMUX_COPY__ '#{pane_id}'"
bind -T copy-mode    DoubleClick1Pane  select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "__CCMUX_COPY__ '#{pane_id}'"
bind -T copy-mode    TripleClick1Pane  select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "__CCMUX_COPY__ '#{pane_id}'"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "__CCMUX_COPY__ '#{pane_id}'"
bind -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel "__CCMUX_COPY__ '#{pane_id}'"
bind -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel "__CCMUX_COPY__ '#{pane_id}'"
bind -T copy-mode-vi C-j               send-keys -X copy-pipe-and-cancel "__CCMUX_COPY__ '#{pane_id}'"
bind -T copy-mode-vi DoubleClick1Pane  select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "__CCMUX_COPY__ '#{pane_id}'"
bind -T copy-mode-vi TripleClick1Pane  select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "__CCMUX_COPY__ '#{pane_id}'"
bind -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel "__CCMUX_COPY__ '#{pane_id}'" }
bind -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel "__CCMUX_COPY__ '#{pane_id}'" }

# --- sizing: the daemon is authoritative (resize-window per lens dims) ---
# NOTE: `window-size manual` is applied PER-SESSION by the daemon after each
# session exists (Controller.stampSession), never here and never globally. On
# tmux 3.6b, creating a session while window-size is globally manual crashes the
# server ("server exited unexpectedly"). Verified empirically.

# --- flow control: DELIBERATELY NOT using control-mode pause-after ---
# Do NOT enable `pause-after` (via `refresh-client -f pause-after=N`). Two
# empirical reasons (Phase 8, cmd/spike-flood):
#   1. It silently switches the wire format from %output to %extended-output,
#      which our control-mode parser does not handle → TOTAL output loss.
#   2. It is unnecessary. The daemon fans pane output out to lenses NON-BLOCKING
#      (session.fanout drops + flags lagged on a full subscriber), so it always
#      drains tmux promptly and tmux never has cause to pause it. Under a real
#      flood the tmux server RSS stays flat (PTY backpressure throttles the
#      producer) and Ctrl-C interrupts in <60ms. The correct back-pressure for a
#      SLOW LENS is the per-subscriber drop + snapshot-reseed (session.Sub.Drain
#      + writeLoop), which must NOT throttle the pane for everyone.

# --- persistence & chrome ---
set -g history-limit 10000
set -g status off
set -g destroy-unattached off
set -g allow-passthrough on
# Keep the server alive with zero sessions so the daemon can start it, set
# runtime options, then create sessions (default exit-empty on would kill an
# empty server immediately). Safe at startup, unlike window-size manual.
set -g exit-empty off
