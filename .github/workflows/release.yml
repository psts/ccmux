name: release

# Cut a release by pushing a tag:  git tag v0.1.0 && git push origin v0.1.0
# GoReleaser then cross-compiles ccmuxd + ccmux-peers for darwin-arm64 /
# linux-amd64 / linux-arm64 and uploads the tarballs + checksums.txt that
# install.sh downloads.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for the version stamp

      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
