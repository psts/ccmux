name: release

# MANUAL ONLY since 2026-11-02 (user's call): a tag no longer builds anything
# here. /ship deploys by building on verkstan itself (build-daemon.sh), which
# takes seconds instead of minutes. Only verkstan is updated that way: the
# daemons on the Macs (patric-ccmux, dasha-ccmux) stay on v0.1.86 by the
# user's choice. The last published release is v0.1.88.
#
# Run it by hand, from a tag, when a GitHub release is wanted again (a new
# host's install.sh). The native Mac app job left with the app on 2026-11-04;
# both live on the `mac-app` branch.
#   gh workflow run release --ref v0.1.99
# GoReleaser then cross-compiles ccmuxd + ccmux-peers for darwin-arm64 /
# linux-amd64 / linux-arm64 and uploads the tarballs + checksums.txt that
# install.sh downloads.
on:
  workflow_dispatch:

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags for the version stamp

      - uses: actions/setup-go@v7
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
