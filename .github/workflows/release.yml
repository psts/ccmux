name: release

# Cut a release by pushing a tag:  git tag v0.1.0 && git push origin v0.1.0
# GoReleaser then cross-compiles ccmuxd + ccmux-peers for darwin-arm64 /
# linux-amd64 / linux-arm64 and uploads the tarballs + checksums.txt that
# install.sh downloads.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for the version stamp

      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The native Mac app, attached to the same release as ccmux-app.zip — what
  # the app's "Check for Updates…" downloads. Secrets are consumed inside the
  # shell steps (not in `if:` conditions), so the job degrades gracefully:
  # no cert secret → ad-hoc signed build; no notary key → signed, not
  # notarized (first manual install needs right-click→Open; self-updates are
  # unaffected either way).
  macapp:
    runs-on: macos-15
    needs: goreleaser # the release must exist before we can attach to it
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The app is developed against current Swift (6.2 / Xcode 26); the
      # runner's default Xcode lags and its older compiler rejects concurrency
      # captures that are legal now. Select the newest Xcode on the image
      # instead of hand-porting valid code backwards.
      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "selecting $NEWEST"
          sudo xcode-select -s "$NEWEST"
          swift --version

      - name: Build and sign
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$MACOS_CERT_P12" ]; then
            KC="$RUNNER_TEMP/build.keychain-db"
            security create-keychain -p ci "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p ci "$KC"
            echo "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            rm "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" > /dev/null
            security list-keychains -d user -s "$KC" login.keychain
            SIGN_ID=$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
            if [ -z "$SIGN_ID" ]; then
              # Interim fallback: any valid imported identity (e.g. Apple
              # Development while the Developer ID cert is unavailable). Same
              # Team ID, so the app's self-anchoring update pin stays
              # consistent when the real cert replaces the secret. For
              # DISTRIBUTION it behaves like ad-hoc (Gatekeeper does not trust
              # it), hence the warning rather than silence.
              SIGN_ID=$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/^ *1\)/ {print $2; exit}')
              [ -n "$SIGN_ID" ] && echo "::warning::no Developer ID Application identity — signing with \"$SIGN_ID\" (distribution-untrusted, interim)"
            fi
            if [ -z "$SIGN_ID" ]; then
              echo "::warning::imported p12 holds no valid codesigning identity — building ad-hoc"
              SIGN_ID="-"
            fi
            export CCMUX_SIGN_ID="$SIGN_ID"
            export CCMUX_SIGN_OPTS="--options runtime --timestamp"
          else
            echo "::warning::MACOS_CERT_P12 not set — building ad-hoc signed app"
            export CCMUX_SIGN_ID="-"
          fi
          CCMUX_APP_VERSION="${GITHUB_REF_NAME#v}" ./build-app.sh

      - name: Notarize and staple
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          set -euo pipefail
          if [ -z "$APPSTORE_API_KEY_P8" ] || [ -z "$MACOS_CERT_P12" ]; then
            echo "::warning::notary credentials or cert absent — shipping signed-but-not-notarized app"
            exit 0
          fi
          KEY="$RUNNER_TEMP/notary.p8"
          printf '%s' "$APPSTORE_API_KEY_P8" > "$KEY"
          ditto -c -k --keepParent .build/release/ccmux.app "$RUNNER_TEMP/notarize.zip"
          # A slow notary queue must not kill the release: a notarized-but-
          # unstapled app still passes Gatekeeper through Apple's online check
          # once the (already submitted) scan completes — the staple is offline
          # insurance only. First-ever team submissions routinely exceed any
          # sane timeout (seen live: v0.1.8's first attempt). Timeout → warn
          # and ship unstapled; an actual Invalid verdict still fails.
          RC=0
          OUT=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$KEY" --key-id "$APPSTORE_API_KEY_ID" --issuer "$APPSTORE_API_ISSUER_ID" \
            --wait --timeout 20m 2>&1) || RC=$?
          echo "$OUT"
          rm "$KEY"
          if [ "$RC" -eq 124 ] || { [ "$RC" -ne 0 ] && echo "$OUT" | grep -q "In Progress"; }; then
            echo "::warning::notarization still in progress at timeout — shipping signed, unstapled; Gatekeeper's online check passes once Apple finishes"
            exit 0
          fi
          if [ "$RC" -ne 0 ] || ! echo "$OUT" | grep -q "status: Accepted"; then
            echo "notarization failed (rc=$RC)" >&2
            exit 1
          fi
          xcrun stapler staple .build/release/ccmux.app

      - name: Package and attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent .build/release/ccmux.app ccmux-app.zip
          gh release upload "$GITHUB_REF_NAME" ccmux-app.zip --clobber
